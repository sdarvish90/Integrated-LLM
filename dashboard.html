<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useCallback } = React;
    const {
      BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend,
      ResponsiveContainer, PieChart, Pie, Cell,
      ComposedChart, Line, LineChart, Area,
    } = Recharts;

    // Simple icon component using inline SVGs
    const icons = {
      flame: (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
        </svg>
      ),
      factory: (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
          <path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/>
        </svg>
      ),
      zap: (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      ),
      droplets: (

          <path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/>
        </svg>
      ),
      truck: (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

          <path d="M15 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 13.52 9H14"/>
          <circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>
        </svg>
      ),
      car: (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>
        </svg>
      ),
      battery: (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><line x1="22" x2="22" y1="11" y2="13"/>
        </svg>
      ),
      fuel: (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="3" x2="15" y1="22" y2="22"/><line x1="4" x2="14" y1="9" y2="9"/>
          <path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/>
          <path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/>
        </svg>
      ),
      check: (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      ),
      alert: (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/>
        </svg>
      ),
    };

    function Icon({ name, className = "" }) {
      return <span className={"inline-flex " + className}>{icons[name]}</span>;
    }

    // ============================================================
    // CALCULATION ENGINE
    // ============================================================
    const calculateTriGen = (NG_scf_h, config = {}) => {
      const {
        electrical_eff = 0.50, overall_eff = 0.80, H2_coprod_share = 0.223,
        LHV_NG_BTU_scf = 1037, LHV_H2_kWh_kg = 33.33,
        aux_load_frac = 0.03, AC_DC_rate = 0.94,
      } = config;
      if (NG_scf_h === 0) return { H2_kg_day: 0, elec_kWh_day: 0, heat_kW_day: 0, NG_scf_day: 0 };
      const fuel_energy_kW = NG_scf_h * LHV_NG_BTU_scf / 3412;
      const fuel_to_stack = fuel_energy_kW * (1 - H2_coprod_share);
      const H2_energy_kW = fuel_energy_kW * H2_coprod_share;
      const H2_kg_h = H2_energy_kW / LHV_H2_kWh_kg;
      const power_gross = Math.max(1400, electrical_eff * fuel_to_stack);
      const power_net = power_gross * (1 - aux_load_frac);
      const useful_heat = (overall_eff - electrical_eff) * fuel_energy_kW;
      const heat_export_kW = useful_heat * 0.5;
      return {
        H2_kg_day: H2_kg_h * 24,
        elec_kWh_day: power_net * 24 * AC_DC_rate,
        heat_kW_day: heat_export_kW * 24,
        NG_scf_day: NG_scf_h * 24,
      };
    };

    const calculateSMR = (H2_tpd, heat_from_trigen = 0) => {
      if (H2_tpd === 0) return { H2_kg_day: 0, NG_scf_day: 0, CO2_kg_day: 0, elec_kWh_day: 0 };
      const H2_kg_day = H2_tpd * 1000;
      const H2_kg_h = H2_kg_day / 24;
      const NG_kg_h = H2_kg_h * 3;
      const NG_scf_h = NG_kg_h / 0.02007;
      const CO2_kg_h = (NG_kg_h / 16.04) * 44.01;
      return { H2_kg_day, NG_scf_day: NG_scf_h * 24, CO2_kg_day: CO2_kg_h * 24, elec_kWh_day: H2_kg_h * 5 };
    };

    const calculateElectrolyzer = (H2_tpd) => {
      if (H2_tpd === 0) return { H2_kg_day: 0, elec_kWh_day: 0, water_gal_day: 0 };
      const H2_kg_day = H2_tpd * 1000;
      const SEC = 53.04;
      const water_kg_per_kg = 10;
      return { H2_kg_day, elec_kWh_day: H2_kg_day * SEC, water_gal_day: H2_kg_day * water_kg_per_kg / 3.785 };
    };

    const calculateLH2Delivery = (throughput_tpd) => {
      if (throughput_tpd === 0) return { H2_kg_day: 0, elec_kWh_day: 0, heat_kW_day: 0 };
      const H2_kg_day = throughput_tpd * 1000 * 0.98;
      const pump_kW = 8.86 * (throughput_tpd / 0.5);
      const aux_kW = 25;
      return { H2_kg_day, elec_kWh_day: (pump_kW + aux_kW) * 24, heat_kW_day: 25.29 * 24 * (throughput_tpd / 0.5) };
    };

    const calculateH2Station = (H2_from_buffer, H2_from_trailer, demand = 1000) => {
      const total_input = H2_from_buffer + H2_from_trailer;
      if (total_input === 0) return { H2_dispensed: 0, elec_kWh_day: 0, waste_heat: 0 };
      const loss_frac = 0.02;
      const H2_available = total_input * (1 - loss_frac);
      const H2_dispensed = Math.min(H2_available, demand);
      const SEC_buffer = 8, SEC_trailer = 1.5;
      const buffer_after_loss = H2_from_buffer * (1 - loss_frac);
      const trailer_after_loss = H2_from_trailer * (1 - loss_frac);
      const comp_energy = buffer_after_loss * SEC_buffer + trailer_after_loss * SEC_trailer;
      const chiller_energy = (H2_dispensed / 24) * 1 / 2.5 * 24;
      const BOP = 120;
      return { H2_dispensed, elec_kWh_day: comp_energy + chiller_energy + BOP, waste_heat: comp_energy };
    };

    const calculateCNGStation = (trucks) => {
      if (trucks === 0) return { NG_scf_day: 0, elec_kWh_day: 0 };
      const fuel_per_truck = 80, scf_per_GGE = 114;
      const demand_scf = trucks * fuel_per_truck * scf_per_GGE;
      const losses = demand_scf * 0.027;
      const comp_energy = trucks * fuel_per_truck * 0.6;
      const aux = 101.8;
      return { NG_scf_day: demand_scf + losses, elec_kWh_day: comp_energy + aux };
    };

    const calculateFuelCell = (H2_kg_day) => {
      if (H2_kg_day === 0) return { elec_kWh_day: 0, heat_kWh_day: 0 };
      const eta_el = 0.5, eta_th = 0.3, LHV = 33.33, BOP_frac = 0.02;
      const gross_elec = H2_kg_day * LHV * eta_el;
      return { elec_kWh_day: gross_elec * (1 - BOP_frac), heat_kWh_day: H2_kg_day * LHV * eta_th };
    };

    const runScenario = (inputs) => {
      const {
        trigen_NG_scf_h = 0, smr_H2_tpd = 0, electrolyzer_H2_tpd = 0,
        lh2_tpd = 0, gh2_trailer_kg_day = 0, cng_trucks = 25,
        ev_demand_kWh = 20000, fuel_cell_enabled = false, H2_demand = 1000,
      } = inputs;

      const trigen = calculateTriGen(trigen_NG_scf_h);
      const smr = calculateSMR(smr_H2_tpd, trigen.heat_kW_day);
      const elec = calculateElectrolyzer(electrolyzer_H2_tpd);
      const lh2 = calculateLH2Delivery(lh2_tpd);
      const cng = calculateCNGStation(cng_trucks);
      const H2_to_buffer = trigen.H2_kg_day + smr.H2_kg_day + elec.H2_kg_day;

      let H2_to_fc = 0;
      let fc = { elec_kWh_day: 0, heat_kWh_day: 0 };
      if (fuel_cell_enabled && H2_to_buffer > H2_demand) {
        H2_to_fc = H2_to_buffer - H2_demand;
        fc = calculateFuelCell(H2_to_fc);
      }

      const H2_buffer_to_station = H2_to_buffer - H2_to_fc;
      const h2s = calculateH2Station(H2_buffer_to_station, gh2_trailer_kg_day, H2_demand);
      const total_H2_dispensed = h2s.H2_dispensed + lh2.H2_kg_day;

      const elec_gen = trigen.elec_kWh_day + fc.elec_kWh_day;
      const elec_con = elec.elec_kWh_day + h2s.elec_kWh_day + lh2.elec_kWh_day + cng.elec_kWh_day;
      const elec_for_ev = Math.max(0, elec_gen - elec_con);
      const grid_import = Math.max(0, ev_demand_kWh - elec_for_ev);
      const total_NG = trigen.NG_scf_day + smr.NG_scf_day + cng.NG_scf_day;

      const NG_HHV_factor = 0.2847, H2_HHV_factor = 39.4, H2_LHV_factor = 33.33;
      const energy_input = total_NG * NG_HHV_factor + grid_import +
        (lh2_tpd * 1000 + gh2_trailer_kg_day) * H2_HHV_factor;
      const energy_output = total_H2_dispensed * H2_LHV_factor +
        cng.NG_scf_day * NG_HHV_factor + ev_demand_kWh;
      const LEC = energy_output > 0 ? energy_input / energy_output : 0;

      return {
        H2_from_trigen: trigen.H2_kg_day, H2_from_smr: smr.H2_kg_day,
        H2_from_electrolyzer: elec.H2_kg_day, H2_from_lh2: lh2.H2_kg_day,
        H2_from_trailer: gh2_trailer_kg_day, H2_to_fc, H2_dispensed: total_H2_dispensed,
        NG_trigen: trigen.NG_scf_day, NG_smr: smr.NG_scf_day, NG_cng: cng.NG_scf_day, NG_total: total_NG,
        elec_trigen: trigen.elec_kWh_day, elec_fc: fc.elec_kWh_day,
        elec_electrolyzer: elec.elec_kWh_day, elec_h2_station: h2s.elec_kWh_day,
        elec_lh2: lh2.elec_kWh_day, elec_cng: cng.elec_kWh_day, elec_ev: ev_demand_kWh,
        elec_grid: grid_import, elec_gen, elec_con: elec_con + ev_demand_kWh,
        heat_trigen: trigen.heat_kW_day, heat_fc: fc.heat_kWh_day,
        CO2_smr: smr.CO2_kg_day,
        energy_input, energy_output, LEC,
        self_sufficiency: elec_gen > 0 ? Math.min(1, elec_gen / (elec_con + ev_demand_kWh)) : 0,
      };
    };

    // ============================================================
    // TEA HELPERS
    // ============================================================
    const teaCrf = (rate, years) => {
      if (rate === 0) return 1 / years;
      return (rate * Math.pow(1 + rate, years)) / (Math.pow(1 + rate, years) - 1);
    };

    const teaNpv = (cashFlows, rate) => {
      return cashFlows.reduce((acc, cf, t) => acc + cf / Math.pow(1 + rate, t), 0);
    };

    const teaIrr = (cashFlows, maxIter = 200) => {
      // If undiscounted sum is negative, no positive IRR exists
      const undiscountedSum = cashFlows.reduce((s, v) => s + v, 0);
      if (undiscountedSum <= 0) return 0;
      // If all operating cash flows are negative (ignoring year-0 capex), no valid IRR
      const opCFs = cashFlows.slice(1);
      if (opCFs.every(cf => cf <= 0)) return 0;
      let irr = 0.10;
      for (let iter = 0; iter < maxIter; iter++) {
        let npv = 0, dnpv = 0;
        for (let t = 0; t < cashFlows.length; t++) {
          const denom = Math.pow(1 + irr, t);
          npv += cashFlows[t] / denom;
          if (t > 0) dnpv += -t * cashFlows[t] / Math.pow(1 + irr, t + 1);
        }
        if (Math.abs(dnpv) < 1e-10) break;
        const newIrr = irr - npv / dnpv;
        if (Math.abs(newIrr - irr) < 1e-7) return Math.max(0, newIrr);
        irr = Math.max(-0.99, Math.min(10, newIrr));
      }
      return Math.max(0, irr);
    };

    const teaSimplePayback = (cumulativeFlows) => {
      for (let i = 1; i < cumulativeFlows.length; i++) {
        if (cumulativeFlows[i] >= 0) {
          const prev = cumulativeFlows[i - 1];
          return (i - 1) + (-prev / (cumulativeFlows[i] - prev));
        }
      }
      return Infinity;
    };

    // ============================================================
    // TRIGEN TEA (from trigen_tea.py)
    // ============================================================
    const calculateTriGenTEA = (massBalance, econ) => {
      const {
        elec_kWh_day = 0, H2_kg_day = 0, heat_kW_day = 0, NG_scf_day = 0
      } = massBalance;
      if (NG_scf_day === 0) return null;

      const operatingDays = 365 * 0.92;
      const ratedKW = Math.max(1400, elec_kWh_day / 24);
      const annualElecMWh = (elec_kWh_day * operatingDays) / 1000;
      const annualH2Kg = H2_kg_day * operatingDays;
      const annualHeatMMBtu = (heat_kW_day * operatingDays) / 293.07;
      const annualNGMMBtu = (NG_scf_day * operatingDays) / 1000;

      const capexPerKW = econ.trigen_capex_per_kw;
      const equipmentCost = ratedKW * capexPerKW;
      const installCost = equipmentCost * 0.15;
      const engCost = equipmentCost * 0.10;
      const subtotal = equipmentCost + installCost + engCost;
      const contingency = subtotal * 0.10;
      const totalCapex = subtotal + contingency;
      const itcBenefit = totalCapex * 0.30;
      const netCapex = totalCapex - itcBenefit;

      const annualFuel = annualNGMMBtu * econ.ng_price;
      const annualFixedOM = ratedKW * 50;
      const annualVarOM = annualElecMWh * 1000 * 0.005;
      const annualWater = annualElecMWh * 1000 * 0.5 * 0.005;

      const stackReplCost = equipmentCost * 0.40;
      const stackLifeYears = 7;
      const numRepl = Math.floor(econ.project_life / stackLifeYears);
      let stackNPV = 0;
      for (let i = 1; i <= numRepl; i++) {
        const yr = i * stackLifeYears;
        if (yr < econ.project_life) stackNPV += stackReplCost / Math.pow(1 + econ.discount_rate, yr);
      }
      const crf = teaCrf(econ.discount_rate, econ.project_life);
      const annualStackReserve = stackNPV * crf;
      const totalAnnualOpex = annualFuel + annualFixedOM + annualVarOM + annualWater + annualStackReserve;

      const annualElecValue = annualElecMWh * 1000 * econ.electricity_price;
      const annualH2Value = annualH2Kg * econ.h2_price;
      const annualHeatValue = annualHeatMMBtu * econ.heat_price;
      const totalRevenue = annualElecValue + annualH2Value + annualHeatValue;

      const annualizedCapex = netCapex * crf;
      const totalAnnualCost = annualizedCapex + totalAnnualOpex;

      const elecMMBtu = annualElecMWh * 3.412;
      const h2MMBtu = annualH2Kg * 0.114;
      const heatMMBtu = annualHeatMMBtu;
      const totalEnergyMMBtu = elecMMBtu + h2MMBtu + heatMMBtu;
      const elecFrac = totalEnergyMMBtu > 0 ? elecMMBtu / totalEnergyMMBtu : 0;
      const h2Frac = totalEnergyMMBtu > 0 ? h2MMBtu / totalEnergyMMBtu : 0;

      const LCOE = annualElecMWh > 0 ? (totalAnnualCost * elecFrac) / (annualElecMWh * 1000) : 0;
      const LCOH = annualH2Kg > 0 ? (totalAnnualCost * h2Frac) / annualH2Kg : 0;

      const cashFlows = [-netCapex];
      const cumCashFlows = [-netCapex];
      let cum = -netCapex;
      for (let yr = 1; yr <= econ.project_life; yr++) {
        const deg = Math.pow(1 - 0.005, yr - 1);
        const yrRev = totalRevenue * deg;
        const yrFuel = annualFuel * deg;
        let yrOpex = yrFuel + annualFixedOM + annualVarOM * deg + annualWater;
        if (yr % stackLifeYears === 0 && yr < econ.project_life) yrOpex += stackReplCost;
        const yrCF = yrRev - yrOpex;
        cashFlows.push(yrCF);
        cum += yrCF;
        cumCashFlows.push(cum);
      }

      return {
        system: 'TriGen',
        capex: totalCapex, netCapex,
        annualOpex: totalAnnualOpex,
        annualRevenue: totalRevenue,
        annualFuel, annualFixedOM, annualVarOM, annualWater, annualStackReserve,
        LCOE, LCOH,
        NPV: teaNpv(cashFlows, econ.discount_rate),
        IRR: teaIrr(cashFlows),
        payback: teaSimplePayback(cumCashFlows),
        cashFlows, cumCashFlows,
        opexBreakdown: {
          fuel: annualFuel, fixedOM: annualFixedOM, varOM: annualVarOM,
          water: annualWater, stackRepl: annualStackReserve,
        },
        revenueBreakdown: {
          electricity: annualElecValue, hydrogen: annualH2Value, heat: annualHeatValue,
        },
      };
    };

    // ============================================================
    // SMR TEA (simplified)
    // ============================================================
    const calculateSMRTEA = (massBalance, econ) => {
      if (!massBalance.H2_kg_day || massBalance.H2_kg_day === 0) return null;
      // Modular/containerized SMR (~1 tpd scale, e.g. OneH2/BayoTech class)
      // NREL range: $2,000–$5,600/kg/day; mid-range $3,500/kg/day
      const availability = 0.90; // modular units target 90%+
      const operatingDays = 365 * availability;
      const annualH2Kg = massBalance.H2_kg_day * operatingDays;
      const annualNGMMBtu = (massBalance.NG_scf_day * operatingDays) / 1000;

      // CAPEX — modular skid-mounted, factory-fabricated
      const capexPerKgDay = 3500; // $/kg/day capacity (NREL mid-range for distributed SMR)
      const equipCost = massBalance.H2_kg_day * capexPerKgDay;
      const installFactor = 1.15; // lower for factory-built skids vs stick-built
      const engineering = equipCost * 0.08;
      const permitting = 50000; // H2 permitting & safety review
      const subtotal = equipCost * installFactor + engineering + permitting;
      const contingency = subtotal * 0.10;
      const totalCapex = subtotal + contingency;
      const netCapex = totalCapex; // no ITC for gray H2

      // OPEX
      const annualFuel = annualNGMMBtu * econ.ng_price;
      const annualFixedOM = totalCapex * 0.03; // routine maintenance
      const annualVarOM = annualH2Kg * 0.02; // variable consumables
      const waterGalPerKg = 2.5; // process water
      const waterCostPerKgal = 5.00; // $/1000 gal municipal rate
      const annualWater = annualH2Kg * waterGalPerKg / 1000 * waterCostPerKgal;
      // Catalyst replacement reserve (~every 4-5 years, ~$150K per replacement for 1 tpd)
      const catalystReplCost = 150000;
      const catalystLifeYrs = 4.5;
      const numRepl = Math.floor(econ.project_life / catalystLifeYrs);
      const crf = teaCrf(econ.discount_rate, econ.project_life);
      let catalystNPV = 0;
      for (let i = 1; i <= numRepl; i++) {
        const yr = Math.round(i * catalystLifeYrs);
        if (yr < econ.project_life) catalystNPV += catalystReplCost / Math.pow(1 + econ.discount_rate, yr);
      }
      const annualCatalystReserve = catalystNPV * crf;
      const totalOpex = annualFuel + annualFixedOM + annualVarOM + annualWater + annualCatalystReserve;

      const revenue = annualH2Kg * econ.h2_price;
      const LCOH = annualH2Kg > 0 ? (netCapex * crf + totalOpex) / annualH2Kg : 0;

      const cashFlows = [-netCapex];
      let cum = -netCapex;
      const cumCF = [-netCapex];
      for (let yr = 1; yr <= econ.project_life; yr++) {
        const deg = Math.pow(1 - 0.005, yr - 1); // 0.5%/yr degradation
        const cf = revenue * deg - totalOpex;
        cashFlows.push(cf); cum += cf; cumCF.push(cum);
      }
      return {
        system: 'SMR (Modular)', capex: totalCapex, netCapex,
        annualOpex: totalOpex, annualRevenue: revenue, LCOH,
        NPV: teaNpv(cashFlows, econ.discount_rate), IRR: teaIrr(cashFlows),
        payback: teaSimplePayback(cumCF), cashFlows, cumCashFlows: cumCF,
        opexBreakdown: { fuel: annualFuel, fixedOM: annualFixedOM, varOM: annualVarOM, water: annualWater, stackRepl: annualCatalystReserve },
        revenueBreakdown: { hydrogen: revenue },
      };
    };

    // ============================================================
    // ELECTROLYZER TEA — Granular PEM model (from electrolyzer_tea.py)
    // Ref: DOE H2A v3.2018, IRENA Green H2 Cost Reduction (2020), NREL ATB 2024
    // ============================================================
    const calculateElectrolyzerTEA = (massBalance, econ) => {
      if (!massBalance.H2_kg_day || massBalance.H2_kg_day === 0) return null;

      // ── Performance ──
      const availability = 0.90; // 90% uptime (scheduled + unscheduled)
      const operatingDays = 365 * availability;
      const annualH2Kg = massBalance.H2_kg_day * operatingDays;
      const annualOpHrs = operatingDays * 24;
      const SEC = 55; // kWh/kg system-level (stack ~50 + BOP ~5)
      const annualElecMWh = (annualH2Kg * SEC) / 1000;
      const capacityKW = (massBalance.H2_kg_day / 24) * SEC;
      const capacityMW = capacityKW / 1000;

      // ── CAPEX: Component-level breakdown ($/kW of electrolyzer) ──
      const capexPerKW = econ.elec_capex_per_kw; // user-adjustable base
      // Scale: at $500/kW base, split per IRENA/DOE reference
      const scaleFactor = capexPerKW / 500; // normalize to reference
      const stackPerKW        = 280 * scaleFactor;  // stack + MEA + BPP
      const stackBalPerKW     = 40  * scaleFactor;  // gaskets, endplates
      const rectifierPerKW    = 80  * scaleFactor;  // power electronics
      const dcConverterPerKW  = 30  * scaleFactor;
      const switchgearPerKW   = 25  * scaleFactor;
      const waterTreatPerKW   = 30  * scaleFactor;  // DI + RO
      const thermalMgmtPerKW  = 35  * scaleFactor;  // cooling, HX
      const gasProcPerKW      = 40  * scaleFactor;  // drying, purification
      const pipingPerKW       = 25  * scaleFactor;  // piping, valves, instruments
      const controlPerKW      = 20  * scaleFactor;  // PLC, HMI, SCADA
      const safetyPerKW       = 15  * scaleFactor;  // ventilation, detection

      // H2 compression (electrolyzer output ~30 bar → 200-450 bar storage)
      const compressorPerKW   = 50  * scaleFactor;

      const equipPerKW = stackPerKW + stackBalPerKW + rectifierPerKW + dcConverterPerKW
        + switchgearPerKW + waterTreatPerKW + thermalMgmtPerKW + gasProcPerKW
        + pipingPerKW + controlPerKW + safetyPerKW + compressorPerKW;
      const equipCost = capacityKW * equipPerKW;

      // Installation
      const civilPerKW        = 30 * scaleFactor;
      const elecInstallPerKW  = 25 * scaleFactor;
      const mechInstallPerKW  = 20 * scaleFactor;
      const commissionPerKW   = 15 * scaleFactor;
      const installCost = capacityKW * (civilPerKW + elecInstallPerKW + mechInstallPerKW + commissionPerKW);

      // Soft costs
      const engineering = equipCost * 0.08;
      const projectMgmt = equipCost * 0.05;
      const contingency = (equipCost + installCost + engineering + projectMgmt) * 0.10;
      const totalCapex = equipCost + installCost + engineering + projectMgmt + contingency;

      // Grid interconnection cost (utility-scale power draw)
      const gridInterconnect = capacityMW > 0.5 ? (80000 + capacityMW * 50000) : 40000;
      const totalCapexWithGrid = totalCapex + gridInterconnect;

      // ITC: only applicable if powered by clean electricity (lifecycle CI < 4 kg CO2/kg H2)
      // Grid-powered electrolysis at ~55 kWh/kg with US avg grid (~0.4 kg CO2/kWh) = 22 kg CO2/kg H2
      // → Does NOT qualify for 45V PTC or 48E ITC unless paired with dedicated renewables
      // Use econ flag; default: no subsidy for grid-powered
      const cleanPowered = econ.elec_clean_powered || false;
      const itcRate = cleanPowered ? 0.30 : 0;
      const netCapex = totalCapexWithGrid * (1 - itcRate);

      // ── OPEX: Detailed breakdown ──
      // Electricity (dominant cost)
      const annualElecCost = annualElecMWh * econ.elec_cost_per_mwh;
      // Demand charges for grid connection
      const demandChargePerKWMonth = cleanPowered ? 0 : 12; // $/kW/month; 0 if behind-the-meter renewables
      const annualDemandCharge = capacityKW * demandChargePerKWMonth * 12;

      // Water: feedwater + cooling + wastewater treatment
      const feedwaterLPerKg = 9;     // L/kg H2 consumed
      const wastewaterLPerKg = 42;   // L/kg H2 (cooling blowdown, etc)
      const waterCostPerM3 = 1.36;   // $/m3
      const annualFeedwater = annualH2Kg * feedwaterLPerKg / 1000 * waterCostPerM3;
      const annualWastewater = annualH2Kg * wastewaterLPerKg / 1000 * waterCostPerM3 * 0.3; // treatment cheaper
      const annualWater = annualFeedwater + annualWastewater;

      // Labor
      const numOperators = Math.max(1, Math.ceil(capacityMW * 0.05));
      const annualLabor = numOperators * 80000;

      // Maintenance
      const annualFixedOM = totalCapex * 0.02;
      const annualVarOM = annualH2Kg * 0.05;
      // Major maintenance every 5 years (3% of equipment CAPEX)
      const majorMaintCost = equipCost * 0.03;
      const majorMaintInterval = 5;
      const numMajorMaint = Math.floor(econ.project_life / majorMaintInterval);
      let majorMaintNPV = 0;
      for (let i = 1; i <= numMajorMaint; i++) {
        const yr = i * majorMaintInterval;
        if (yr < econ.project_life) majorMaintNPV += majorMaintCost / Math.pow(1 + econ.discount_rate, yr);
      }
      const crf = teaCrf(econ.discount_rate, econ.project_life);
      const annualMajorMaint = majorMaintNPV * crf;

      // Stack replacement
      const stackCost = capacityKW * stackPerKW;
      const stackLifeHrs = 80000;
      const stackLifeYrs = stackLifeHrs / annualOpHrs;
      const numRepl = Math.floor(econ.project_life / stackLifeYrs);
      let stackNPV = 0;
      for (let i = 1; i <= numRepl; i++) {
        const yr = Math.round(i * stackLifeYrs);
        if (yr < econ.project_life) stackNPV += stackCost * 0.50 / Math.pow(1 + econ.discount_rate, yr);
      }
      const annualStackReserve = stackNPV * crf;

      // Consumables (DI resin, desiccant, electrolyte makeup)
      const annualConsumables = annualH2Kg * (0.002 + 0.001 + 0.005);

      // Insurance + property tax + admin
      const annualInsurance = totalCapex * 0.005;
      const annualPropTax = totalCapex * 0.01;
      const annualAdmin = capacityKW * 2;

      const totalOpex = annualElecCost + annualDemandCharge + annualWater + annualLabor
        + annualFixedOM + annualVarOM + annualMajorMaint + annualStackReserve
        + annualConsumables + annualInsurance + annualPropTax + annualAdmin;

      // ── LCOH ──
      const annualizedCapex = netCapex * crf;
      const LCOH = annualH2Kg > 0 ? (annualizedCapex + totalOpex) / annualH2Kg : 0;

      // ── Cash flows ──
      const revenue = annualH2Kg * econ.h2_price;
      const cashFlows = [-netCapex];
      let cum = -netCapex;
      const cumCF = [-netCapex];
      for (let yr = 1; yr <= econ.project_life; yr++) {
        const deg = Math.pow(1 - 0.01, yr - 1); // 1%/yr degradation
        const yrH2 = annualH2Kg * deg;
        const yrRev = yrH2 * econ.h2_price;
        const inflFactor = Math.pow(1 + econ.inflation_rate, yr - 1);
        const yrOpex = totalOpex * inflFactor;
        const cf = yrRev - yrOpex;
        cashFlows.push(cf); cum += cf; cumCF.push(cum);
      }

      return {
        system: 'Electrolyzer', capex: totalCapexWithGrid, netCapex,
        annualOpex: totalOpex, annualRevenue: revenue,
        LCOH,
        NPV: teaNpv(cashFlows, econ.discount_rate), IRR: teaIrr(cashFlows),
        payback: teaSimplePayback(cumCF), cashFlows, cumCashFlows: cumCF,
        opexBreakdown: {
          fuel: annualElecCost + annualDemandCharge,
          fixedOM: annualFixedOM + annualLabor + annualMajorMaint + annualInsurance + annualPropTax + annualAdmin,
          varOM: annualVarOM + annualConsumables,
          water: annualWater,
          stackRepl: annualStackReserve,
        },
        revenueBreakdown: { hydrogen: revenue },
      };
    };

    // ============================================================
    // SOLAR TEA (from solar_tea.py)
    // ============================================================
    const calculateSolarTEA = (econ) => {
      if (!econ.solar_capacity_mw || econ.solar_capacity_mw === 0) return null;
      const capMWdc = econ.solar_capacity_mw;
      const capWdc = capMWdc * 1e6;
      const dcAcRatio = 1.15;
      const capMWac = capMWdc / dcAcRatio;
      const capWac = capMWac * 1e6;
      const cf = 0.26;

      const capexPerWdc = econ.solar_capex_per_wdc;
      // Module + racking + BOS + install + soft
      const modulesCost = capWdc * 0.25;
      const rackingCost = capWdc * 0.14; // with tracker
      const bosCost = capWdc * 0.09;
      const installCost = capWdc * 0.10;
      const interconnect = capWac * 0.03;
      const hardware = modulesCost + rackingCost + bosCost + installCost + interconnect;
      const softCosts = hardware * 0.05 + capWdc * 0.01 + capWdc * 0.02;
      const subtotal = hardware + softCosts;
      const totalCapex = subtotal * 1.05 * 1.05; // contingency + dev margin
      // Override if user changed capex slider
      const actualCapex = capWdc * capexPerWdc;
      const useCapex = Math.abs(capexPerWdc - 0.60) > 0.01 ? actualCapex : totalCapex;
      const itcBenefit = useCapex * 0.30;
      const netCapex = useCapex - itcBenefit;

      const yr1GenMWh = capMWac * 8760 * cf * 0.98; // 2% first-year LID
      const annualFixedOM = capMWdc * 1000 * 15; // $15/kWdc-yr
      const annualInsurance = useCapex * 0.004;
      const annualPropTax = useCapex * 0.01;
      const inverterCost = capWac * 0.05;
      const projLife = 30;
      const numInvRepl = Math.floor(projLife / 15);
      let invReplNPV = 0;
      for (let i = 1; i <= numInvRepl; i++) {
        if (i * 15 < projLife) invReplNPV += inverterCost / Math.pow(1 + econ.discount_rate, i * 15);
      }
      const crf30 = teaCrf(econ.discount_rate, projLife);
      const annualInvReserve = invReplNPV * crf30;
      const totalOpex = annualFixedOM + annualInsurance + annualPropTax + annualInvReserve;

      let lifetimeGenNPV = 0;
      for (let yr = 1; yr <= projLife; yr++) {
        const yrGen = yr1GenMWh * Math.pow(1 - 0.005, yr - 1);
        lifetimeGenNPV += yrGen / Math.pow(1 + econ.discount_rate, yr);
      }
      let lifetimeOpexNPV = 0;
      for (let yr = 1; yr <= projLife; yr++) {
        lifetimeOpexNPV += totalOpex * Math.pow(1.02, yr - 1) / Math.pow(1 + econ.discount_rate, yr);
      }
      const LCOE = (netCapex + lifetimeOpexNPV) / lifetimeGenNPV; // $/MWh

      const revenue = yr1GenMWh * econ.electricity_price * 1000; // elec price $/kWh -> *1000 for MWh
      const cashFlows = [-netCapex];
      let cum = -netCapex;
      const cumCF = [-netCapex];
      for (let yr = 1; yr <= econ.project_life; yr++) {
        const deg = Math.pow(1 - 0.005, yr - 1);
        const yrGen = yr1GenMWh * deg;
        const yrRev = yrGen * econ.electricity_price * 1000;
        const yrOpex = totalOpex * Math.pow(1.02, yr - 1);
        const cf = yrRev - yrOpex;
        cashFlows.push(cf); cum += cf; cumCF.push(cum);
      }

      return {
        system: 'Solar', capex: useCapex, netCapex,
        annualOpex: totalOpex, annualRevenue: revenue,
        LCOE, annualGenMWh: yr1GenMWh,
        NPV: teaNpv(cashFlows, econ.discount_rate), IRR: teaIrr(cashFlows),
        payback: teaSimplePayback(cumCF), cashFlows, cumCashFlows: cumCF,
        opexBreakdown: { fuel: 0, fixedOM: annualFixedOM, varOM: 0, water: 0, stackRepl: annualInvReserve },
        revenueBreakdown: { electricity: revenue },
      };
    };

    // ============================================================
    // WIND TEA (from wind_tea.py)
    // ============================================================
    const calculateWindTEA = (econ) => {
      if (!econ.wind_capacity_mw || econ.wind_capacity_mw === 0) return null;
      const capMW = econ.wind_capacity_mw;
      const capKW = capMW * 1000;
      const cf = 0.35;
      const yr1GenMWh = capMW * 8760 * cf;
      const projLife = 30;

      const capexPerKW = econ.wind_capex_per_kw;
      // Turbine 800 + BOS 250 + install 80 + soft costs
      const turbineCost = capKW * 800;
      const bosCost = capKW * 250;
      const installCost = capKW * 80;
      const hardCosts = turbineCost + bosCost + installCost;
      const softCosts = hardCosts * 0.05 + capKW * 30 + capKW * 20;
      const subtotal = hardCosts + softCosts;
      const totalCapex = subtotal * 1.05; // contingency
      // Override if user changed capex slider
      const actualCapex = capKW * capexPerKW;
      const useCapex = Math.abs(capexPerKW - 1200) > 10 ? actualCapex : totalCapex;

      const netCapex = useCapex; // Wind typically uses PTC not ITC

      // O&M escalation schedule
      const getFixedOM = (yr) => {
        if (yr <= 2) return useCapex * 0.010;
        if (yr <= 10) return useCapex * 0.015;
        return useCapex * 0.020;
      };
      const yr1FixedOM = getFixedOM(1);
      const yr1VarOM = yr1GenMWh * 2;
      const yr1Insurance = useCapex * 0.005;
      const yr1PropTax = useCapex * 0.01;
      const yr1LandLease = capMW * 5000;
      const totalOpex = yr1FixedOM + yr1VarOM + yr1Insurance + yr1PropTax + yr1LandLease;

      // PTC $26/MWh for 10 years
      const ptcPerMWh = 26;
      const ptcYears = 10;

      let lifetimeGenNPV = 0;
      for (let yr = 1; yr <= projLife; yr++) {
        lifetimeGenNPV += yr1GenMWh * Math.pow(1 - 0.005, yr - 1) / Math.pow(1 + econ.discount_rate, yr);
      }
      let lifetimeOpexNPV = 0;
      for (let yr = 1; yr <= projLife; yr++) {
        const esc = Math.pow(1.03, yr - 1);
        lifetimeOpexNPV += (getFixedOM(yr) * esc + yr1VarOM + yr1Insurance + yr1PropTax + yr1LandLease) / Math.pow(1 + econ.discount_rate, yr);
      }
      let ptcValueNPV = 0;
      for (let yr = 1; yr <= ptcYears; yr++) {
        ptcValueNPV += yr1GenMWh * Math.pow(1 - 0.005, yr - 1) * ptcPerMWh / Math.pow(1 + econ.discount_rate, yr);
      }
      const LCOE = (useCapex + lifetimeOpexNPV) / lifetimeGenNPV;
      const LCOEwithPTC = (useCapex + lifetimeOpexNPV - ptcValueNPV) / lifetimeGenNPV;

      const energyPrice = econ.electricity_price * 1000; // $/kWh -> $/MWh
      const revenue = yr1GenMWh * energyPrice;
      const cashFlows = [-netCapex];
      let cum = -netCapex;
      const cumCF = [-netCapex];
      for (let yr = 1; yr <= econ.project_life; yr++) {
        const deg = Math.pow(1 - 0.005, yr - 1);
        const yrGen = yr1GenMWh * deg;
        let yrRev = yrGen * energyPrice;
        if (yr <= ptcYears) yrRev += yrGen * ptcPerMWh;
        const esc = Math.pow(1.03, yr - 1);
        let yrOpex = getFixedOM(yr) * esc + yr1VarOM + yr1Insurance + yr1PropTax + yr1LandLease;
        if (yr === 15) yrOpex += turbineCost * 0.15; // gearbox replacement
        const cf = yrRev - yrOpex;
        cashFlows.push(cf); cum += cf; cumCF.push(cum);
      }

      return {
        system: 'Wind', capex: useCapex, netCapex,
        annualOpex: totalOpex, annualRevenue: revenue,
        LCOE, LCOEwithPTC, annualGenMWh: yr1GenMWh,
        NPV: teaNpv(cashFlows, econ.discount_rate), IRR: teaIrr(cashFlows),
        payback: teaSimplePayback(cumCF), cashFlows, cumCashFlows: cumCF,
        opexBreakdown: { fuel: 0, fixedOM: yr1FixedOM, varOM: yr1VarOM, water: 0, stackRepl: 0 },
        revenueBreakdown: { electricity: revenue },
      };
    };

    // ============================================================
    // BESS TEA (from bess_tea.py)
    // ============================================================
    const calculateBESSTEA = (econ) => {
      if (!econ.bess_power_mw || econ.bess_power_mw === 0) return null;
      const powerMW = econ.bess_power_mw;
      const durationHrs = econ.bess_duration_hrs;
      const energyMWh = powerMW * durationHrs;
      const powerKW = powerMW * 1000;
      const energyKWh = energyMWh * 1000;
      const rte = 0.85;
      const dailyCycles = 1.0;
      const annualCycles = dailyCycles * 365 * 0.99;
      const dod = 0.95;
      const projLife = 20;

      const energyCapex = energyKWh * 200;
      const powerCapex = powerKW * 325;
      const bosCost = powerKW * 0 + energyKWh * (10 + 20 + 15);
      const installCost = powerKW * (20 + 30 + 50 + 15);
      const hardware = energyCapex + powerCapex + bosCost + installCost;
      const softCosts = hardware * 0.08 + powerKW * 10;
      const subtotal = hardware + softCosts;
      const totalCapex = subtotal * 1.05;
      const itcBenefit = totalCapex * 0.30;
      const netCapex = totalCapex - itcBenefit;

      const batteryCost = energyCapex + powerCapex;
      const annualFixedOM = powerKW * 11;
      const annualThroughput = energyMWh * annualCycles * 2 * dod;
      const annualVarOM = annualThroughput * 0.5;
      const annualInsurance = totalCapex * 0.004;
      const annualPropTax = totalCapex * 0.01;
      const annualSiteLease = powerMW * 2000;

      const augInterval = 2;
      const augFraction = 0.20;
      const numAug = Math.floor(projLife / augInterval);
      let augNPV = 0;
      for (let i = 1; i <= numAug; i++) {
        if (i * augInterval < projLife) {
          augNPV += batteryCost * augFraction / Math.pow(1 + econ.discount_rate, i * augInterval);
        }
      }
      const crf = teaCrf(econ.discount_rate, projLife);
      const annualAugReserve = augNPV * crf;
      const totalOpex = annualFixedOM + annualVarOM + annualInsurance + annualPropTax + annualSiteLease + annualAugReserve;

      // SOH tracking
      const calDeg = 0.01;
      const cycleDegPerCycle = 0.10 / 3000;
      const sohByYear = [1.0];
      const augYears = [];
      let soh = 1.0;
      for (let yr = 1; yr <= projLife; yr++) {
        soh -= calDeg;
        soh -= annualCycles * cycleDegPerCycle;
        if (soh < 0.85 && yr % augInterval === 0) {
          augYears.push(yr);
          soh = Math.min(1.0, soh + augFraction);
        }
        soh = Math.max(0.90, soh);
        sohByYear.push(soh);
      }

      const dischargedMWh = annualThroughput / 2 * rte;
      let lifetimeDischargeNPV = 0;
      for (let yr = 1; yr <= projLife; yr++) {
        lifetimeDischargeNPV += dischargedMWh * sohByYear[yr] / Math.pow(1 + econ.discount_rate, yr);
      }
      const LCOS = netCapex / lifetimeDischargeNPV +
        totalOpex / dischargedMWh; // simplified

      const arbitrageSpread = 30;
      const capacityPayment = powerKW * 50 * 0.90;
      const ancillary = powerMW * 30000 * 0.5 + powerMW * 10000;
      const annualRevenue = dischargedMWh * arbitrageSpread + capacityPayment + ancillary;

      const cashFlows = [-netCapex];
      let cum = -netCapex;
      const cumCF = [-netCapex];
      for (let yr = 1; yr <= econ.project_life; yr++) {
        const sohYr = yr <= projLife ? sohByYear[yr] : sohByYear[projLife];
        const yrRev = dischargedMWh * sohYr * arbitrageSpread + capacityPayment + ancillary;
        const infl = Math.pow(1.02, yr - 1);
        let yrOpex = (totalOpex - annualAugReserve) * infl;
        if (augYears.includes(yr)) yrOpex += batteryCost * augFraction * Math.pow(1.025, yr - 1);
        const cf = yrRev - yrOpex;
        cashFlows.push(cf); cum += cf; cumCF.push(cum);
      }

      return {
        system: 'BESS', capex: totalCapex, netCapex,
        annualOpex: totalOpex, annualRevenue,
        LCOS, powerMW, energyMWh, durationHrs,
        NPV: teaNpv(cashFlows, econ.discount_rate), IRR: teaIrr(cashFlows),
        payback: teaSimplePayback(cumCF), cashFlows, cumCashFlows: cumCF,
        opexBreakdown: { fuel: 0, fixedOM: annualFixedOM, varOM: annualVarOM, water: 0, stackRepl: annualAugReserve },
        revenueBreakdown: { arbitrage: dischargedMWh * arbitrageSpread, capacity: capacityPayment, ancillary },
      };
    };

    // ============================================================
    // H2 STATION TEA (from h2_station_tea.py)
    // ============================================================
    const calculateH2StationTEA = (massBalance, econ) => {
      const h2Dispensed = massBalance.H2_dispensed || 0;
      if (h2Dispensed === 0) return null;

      const capacity = econ.h2_station_capacity || h2Dispensed;
      const operatingDays = 365;
      const availability = 0.98;
      const utilization = 0.80;
      const annualKg = capacity * utilization * operatingDays * availability;
      const projLife = econ.project_life;

      // CAPEX - Equipment with scaling
      const compScale = capacity / 1000;
      const compressor = 300000 * Math.pow(compScale, 0.67) * 2; // 2 units
      const lpBufferKg = capacity / 24 * 4;
      const lpStorage = lpBufferKg * 800;
      const peakHourKg = capacity / 18 * 2.0;
      const hpStorageKg = peakHourKg * 8;
      const hpStorage = hpStorageKg * 1200;
      const chillerScale = capacity / 450;
      const chiller = 50000 * Math.pow(chillerScale, 0.50);
      const dispensers = 2 * 150000;
      const controls = 75000;
      const safety = 50000;
      const site = 150000 + 75000 + 50000;
      const equipment = compressor + lpStorage + hpStorage + chiller + dispensers + controls + safety;
      const installation = equipment * 0.15;
      const engineering = equipment * 0.10;
      const permitting = 30000;
      const subtotal = equipment + site + installation + engineering + permitting;
      const contingency = subtotal * 0.10;
      const totalCapex = subtotal + contingency;

      // OPEX
      const secTotal = 1.8 + 0.8 + 0.2; // compression + cooling + BOP kWh/kg
      const elecPrice = econ.electricity_price;
      const opexElec = annualKg * secTotal * elecPrice;
      const opexMaint = compressor * 0.05 + (totalCapex - compressor) * 0.02;
      const opexLabor = 10 * 52 * 50;
      const opexInsurance = totalCapex * 0.01;
      const opexPropTax = totalCapex * 0.01;
      const opexRent = 36000;
      const feedstockCost = econ.h2_station_feedstock_cost || 5.0;
      const opexLosses = annualKg * 0.005 * feedstockCost;
      const totalOpex = opexElec + opexMaint + opexLabor + opexInsurance + opexPropTax + opexRent + opexLosses;

      // Levelized cost of dispensing
      const crf = teaCrf(econ.discount_rate, projLife);
      const lcodCapex = (totalCapex * crf) / annualKg;
      const lcodOpex = totalOpex / annualKg;
      const lcodFeedstock = feedstockCost * 1.005;
      const lcodTotal = lcodCapex + lcodOpex + lcodFeedstock;

      // Revenue & cash flows
      const revenue = annualKg * econ.h2_price;
      const annualH2Cost = annualKg * feedstockCost * 1.005;
      const annualProfit = revenue - annualH2Cost - totalOpex;
      const cashFlows = [-totalCapex];
      let cum = -totalCapex;
      const cumCF = [-totalCapex];
      for (let yr = 1; yr <= projLife; yr++) {
        const util = yr <= 3 ? 0.50 + (0.80 - 0.50) * (yr - 1) / 3 : 0.80;
        const yrKg = capacity * util * operatingDays * availability;
        const yrRev = yrKg * econ.h2_price;
        const yrH2Cost = yrKg * feedstockCost * 1.005;
        const yrOpex = totalOpex * (util / 0.80);
        const cf = yrRev - yrH2Cost - yrOpex;
        cashFlows.push(cf); cum += cf; cumCF.push(cum);
      }

      return {
        system: 'H2 Station', capex: totalCapex, netCapex: totalCapex,
        annualOpex: totalOpex + annualH2Cost, annualRevenue: revenue,
        LCOH: lcodTotal, LCOE: null,
        NPV: teaNpv(cashFlows, econ.discount_rate), IRR: teaIrr(cashFlows),
        payback: teaSimplePayback(cumCF), cashFlows, cumCashFlows: cumCF,
        opexBreakdown: { fuel: opexElec, fixedOM: opexMaint + opexLabor, varOM: opexLosses, water: 0, stackRepl: 0 },
        revenueBreakdown: { hydrogen: revenue },
      };
    };

    // ============================================================
    // GH2 DELIVERY TEA (from gh2_delivery_tea.py)
    // ============================================================
    const calculateGH2DeliveryTEA = (massBalance, econ) => {
      const trailerKgDay = massBalance.H2_from_trailer || 0;
      if (trailerKgDay === 0) return null;

      const operatingDays = 350;
      const annualH2Kg = trailerKgDay * operatingDays;
      const projLife = econ.project_life;

      // Trailer specs — composite Type IV, 500 bar (~350 bar avg fill)
      // Modern composite trailers carry 700–1100 kg usable at 500 bar
      const trailerCapacityKg = 950; // mid-range 500-bar composite
      const trailerLeasePerMonth = 8000; // current market for composite trailers
      const tractorLeasePerMonth = 3500;

      // Fleet sizing
      const tripsPerDay = trailerKgDay / trailerCapacityKg;
      const tripsPerYear = Math.ceil(tripsPerDay * operatingDays);
      const deliveryDistKm = econ.gh2_delivery_distance || 80;
      const roundTripKm = 2 * deliveryDistKm;
      const travelTime = roundTripKm / 50; // 50 km/h avg (mixed road)
      const loadUnloadHrs = 1.0 + 1.5; // quick-connect loading + cascade unloading
      const roundTripHours = travelTime + loadUnloadHrs;
      const tripsPerTrailerDay = 10 / roundTripHours; // 10-hr driver shift
      const trailersForDemand = Math.ceil(tripsPerDay / tripsPerTrailerDay);
      const numTrailers = trailersForDemand + 1; // +1 swap trailer on-site
      const numTractors = trailersForDemand;

      // Costs
      const costTrailer = numTrailers * trailerLeasePerMonth * 12;
      const costTractor = numTractors * tractorLeasePerMonth * 12;
      const annualKm = tripsPerYear * roundTripKm;
      const costFuel = annualKm * 0.35 * 1.10; // L/km * diesel $/L
      const driverHoursPerTrip = roundTripHours + 0.5; // + pre/post trip
      const costDriver = tripsPerYear * driverHoursPerTrip * 35; // $/hr loaded
      const costMaint = numTrailers * 6000 + annualKm * 0.10;
      const crf = teaCrf(econ.discount_rate, projLife);
      const terminalCapex = 300000; // loading rack share
      const costTerminal = terminalCapex * crf + 10000; // annualized + annual maint
      const deliveryCosts = costTrailer + costTractor + costFuel + costDriver + costMaint + costTerminal;

      const h2ProdCost = econ.gh2_production_cost || 3.0;
      const h2PurchasedKg = annualH2Kg / (1 - 0.01);
      const costH2 = h2PurchasedKg * h2ProdCost;
      const totalAnnual = deliveryCosts + costH2;
      const deliveryCostPerKg = deliveryCosts / annualH2Kg;
      const deliveredCostPerKg = totalAnnual / annualH2Kg;

      // Cash flows — standalone delivery business: buy at production cost, sell at retail
      const totalCapex = terminalCapex; // terminal loading rack (fleet is leased)
      const annualRevenue = annualH2Kg * econ.h2_price;
      const cashFlows = [-totalCapex];
      let cum = -totalCapex;
      const cumCF = [-totalCapex];
      for (let yr = 1; yr <= projLife; yr++) {
        const cf = annualRevenue - costH2 - deliveryCosts;
        cashFlows.push(cf); cum += cf; cumCF.push(cum);
      }

      return {
        system: 'GH2 Delivery', capex: totalCapex, netCapex: totalCapex,
        annualOpex: deliveryCosts + costH2, annualRevenue,
        LCOH: deliveredCostPerKg, deliveryCostPerKg, LCOE: null,
        NPV: teaNpv(cashFlows, econ.discount_rate), IRR: teaIrr(cashFlows),
        payback: teaSimplePayback(cumCF), cashFlows, cumCashFlows: cumCF,
        opexBreakdown: { fuel: costFuel, fixedOM: costTrailer + costTractor + costMaint, varOM: costDriver, water: 0, stackRepl: costTerminal, feedstock: costH2 },
        revenueBreakdown: { hydrogen: annualRevenue },
      };
    };

    // ============================================================
    // LH2 DELIVERY TEA (from lh2_delivery_tea.py)
    // ============================================================
    const calculateLH2DeliveryTEA = (massBalance, econ) => {
      const lh2KgDay = massBalance.H2_from_lh2 || 0;
      if (lh2KgDay === 0) return null;

      const operatingDays = 350;
      const annualDemand = lh2KgDay * operatingDays;
      const projLife = econ.project_life;

      // LH2 Tanker specs (Standard 4000 kg)
      const tankerCapKg = 4000 * 0.95; // 3800 usable
      const tankerLeaseMonth = 22000;
      const tractorLeaseMonth = 3500;

      // Fleet sizing
      const tripsPerDay = lh2KgDay / tankerCapKg;
      const tripsPerYear = Math.ceil(tripsPerDay * operatingDays);
      const deliveryDistKm = econ.lh2_delivery_distance || 150;
      const roundTripKm = 2 * deliveryDistKm;
      const roundTripHours = roundTripKm / 60 + 1.0 + 2.0;
      const tripsPerTankerDay = 10 / roundTripHours;
      const tankersNeeded = Math.ceil(tripsPerDay / tripsPerTankerDay);
      const tractorsNeeded = tankersNeeded;

      // Delivery costs
      const costTanker = tankersNeeded * tankerLeaseMonth * 12;
      const costTractor = tractorsNeeded * tractorLeaseMonth * 12;
      const annualKm = tripsPerYear * roundTripKm;
      const costFuel = annualKm * 0.50 * 1.30;
      const costDriver = tripsPerYear * (roundTripHours + 1.0) * 40;
      const costMaint = tankersNeeded * 20000 + annualKm * 0.12;
      const boiloffPct = 0.003 * 0.5 + 0.01; // transit + transfer
      const lh2CostAtPlant = econ.lh2_cost_at_plant || 4.50;
      const lh2LostKg = annualDemand * boiloffPct / (1 - boiloffPct);
      const costBoiloff = lh2LostKg * lh2CostAtPlant;
      const deliveryTotal = costTanker + costTractor + costFuel + costDriver + costMaint + costBoiloff;
      const deliveryCostPerKg = deliveryTotal / annualDemand;

      // Station CAPEX (cryo tank, pump, vaporizer, dispenser)
      const capacity = lh2KgDay;
      const storageKg = capacity * 3;
      const cryoTank = storageKg * 400;
      const pumpScale = capacity / 500;
      const pump = 250000 * Math.pow(pumpScale, 0.60) * 2;
      const vaporizerKW = (capacity / 24) * 1.2;
      const vaporizer = vaporizerKW * 300;
      const dispenser = 2 * 120000;
      const precooler = 30000;
      const controls = 100000;
      const safety = 75000;
      const siteCost = 150000 + 40000 + 75000;
      const stationEquip = cryoTank + pump + vaporizer + dispenser + precooler + controls + safety;
      const stationInstall = stationEquip * 0.15;
      const stationEng = stationEquip * 0.10;
      const stationPermit = 40000;
      const stationSubtotal = stationEquip + siteCost + stationInstall + stationEng + stationPermit;
      const stationContingency = stationSubtotal * 0.10;
      const stationCapex = stationSubtotal + stationContingency;

      // Station OPEX
      const opexElec = annualDemand * 0.5 * econ.electricity_price; // pump SEC
      const opexMaint = stationCapex * 0.03;
      const opexLabor = 10 * 52 * 50;
      const opexInsurance = stationCapex * 0.01;
      const opexPropTax = stationCapex * 0.01;
      const opexRent = 36000;
      const avgStorageKg = storageKg / 2;
      const dailyBoiloff = avgStorageKg * 0.002;
      const annualBoiloff = dailyBoiloff * 365;
      const opexBoiloff = annualBoiloff * lh2CostAtPlant;
      const stationOpex = opexElec + opexMaint + opexLabor + opexInsurance + opexPropTax + opexRent + opexBoiloff;

      // LCOD
      const crf = teaCrf(econ.discount_rate, projLife);
      const totalLossPct = boiloffPct + (annualBoiloff / annualDemand);
      const lh2PerKgDispensed = 1 / (1 - totalLossPct);
      const lcodFeedstock = lh2CostAtPlant * lh2PerKgDispensed;
      const lcodDelivery = deliveryCostPerKg;
      const lcodCapex = (stationCapex * crf) / annualDemand;
      const lcodOpex = stationOpex / annualDemand;
      const lcodTotal = lcodFeedstock + lcodDelivery + lcodCapex + lcodOpex;

      // Cash flows
      const totalCapex = stationCapex;
      const annualRevenue = annualDemand * econ.h2_price;
      const annualLH2Cost = annualDemand * lh2PerKgDispensed * lh2CostAtPlant;
      const cashFlows = [-totalCapex];
      let cum = -totalCapex;
      const cumCF = [-totalCapex];
      for (let yr = 1; yr <= projLife; yr++) {
        const cf = annualRevenue - annualLH2Cost - deliveryTotal - stationOpex;
        cashFlows.push(cf); cum += cf; cumCF.push(cum);
      }

      return {
        system: 'LH2 Delivery', capex: totalCapex, netCapex: totalCapex,
        annualOpex: stationOpex + deliveryTotal + annualLH2Cost, annualRevenue,
        LCOH: lcodTotal, LCOE: null,
        NPV: teaNpv(cashFlows, econ.discount_rate), IRR: teaIrr(cashFlows),
        payback: teaSimplePayback(cumCF), cashFlows, cumCashFlows: cumCF,
        opexBreakdown: { fuel: opexElec + costFuel, fixedOM: opexMaint + opexLabor + costMaint, varOM: costDriver + opexBoiloff + costBoiloff, water: 0, stackRepl: 0, feedstock: annualLH2Cost },
        revenueBreakdown: { hydrogen: annualRevenue },
      };
    };

    // ============================================================
    // CNG STATION TEA
    // ============================================================
    const calculateCNGStationTEA = (scenario, econ) => {
      const cngTrucks = scenario.NG_cng ? Math.round(scenario.NG_cng / ((80 * 114) * 1.027)) : 0;
      if (cngTrucks === 0) return null;

      const operatingDays = 365;
      const fuelPerTruck = 80; // GGE/truck/day
      const annualGGE = cngTrucks * fuelPerTruck * operatingDays;

      // CAPEX — time-fill CNG station (compressor, storage, dispenser, controls)
      // NREL AFDC: $1.5–2.5M for a 25-truck fleet station
      const compressorScale = cngTrucks / 25;
      const compressor = 400000 * Math.pow(compressorScale, 0.70); // multi-stage 250 bar
      const storageGGE = cngTrucks * fuelPerTruck * 1.5; // 1.5 days buffer
      const storageCascade = storageGGE * 30; // $/GGE storage (ASME vessels)
      const dispensers = Math.ceil(cngTrucks / 8) * 75000; // 1 dispenser per 8 trucks
      const controls = 50000;
      const safety = 30000;
      const siteCivil = 120000 + 60000; // site prep + canopy
      const equipment = compressor + storageCascade + dispensers + controls + safety;
      const installation = equipment * 0.20;
      const engineering = equipment * 0.10;
      const permitting = 25000;
      const subtotal = equipment + siteCivil + installation + engineering + permitting;
      const contingency = subtotal * 0.10;
      const totalCapex = subtotal + contingency;

      // OPEX
      const ngScfDay = scenario.NG_cng || 0;
      const annualNGMMBtu = (ngScfDay * operatingDays) / 1000;
      const opexFuel = annualNGMMBtu * econ.ng_price;
      const secKWhPerGGE = 0.6; // compressor + controls
      const opexElec = annualGGE * secKWhPerGGE * econ.electricity_price;
      const opexMaint = totalCapex * 0.03;
      const opexLabor = 6 * 52 * 45; // part-time attendant
      const opexInsurance = totalCapex * 0.01;
      const opexPropTax = totalCapex * 0.01;
      const totalOpex = opexFuel + opexElec + opexMaint + opexLabor + opexInsurance + opexPropTax;

      // Revenue & LCOF
      const revenue = annualGGE * econ.cng_price_per_gge;
      const crf = teaCrf(econ.discount_rate, econ.project_life);
      const lcof = annualGGE > 0 ? (totalCapex * crf + totalOpex) / annualGGE : 0;

      // Cash flows — ramp up utilization over first 2 years
      const cashFlows = [-totalCapex];
      let cum = -totalCapex;
      const cumCF = [-totalCapex];
      for (let yr = 1; yr <= econ.project_life; yr++) {
        const util = yr <= 2 ? 0.70 + 0.30 * (yr - 1) / 2 : 1.0;
        const yrRev = revenue * util;
        const yrOpex = totalOpex * util;
        const cf = yrRev - yrOpex;
        cashFlows.push(cf); cum += cf; cumCF.push(cum);
      }

      return {
        system: 'CNG Station', capex: totalCapex, netCapex: totalCapex,
        annualOpex: totalOpex, annualRevenue: revenue,
        LCOH: null, LCOE: null, LCOF: lcof,
        NPV: teaNpv(cashFlows, econ.discount_rate), IRR: teaIrr(cashFlows),
        payback: teaSimplePayback(cumCF), cashFlows, cumCashFlows: cumCF,
        opexBreakdown: { fuel: opexFuel, fixedOM: opexMaint + opexLabor, varOM: opexElec, water: 0, stackRepl: 0 },
        revenueBreakdown: { cng: revenue },
      };
    };

    // ============================================================
    // EV CHARGING STATION TEA
    // ============================================================
    const calculateEVStationTEA = (scenario, econ) => {
      const evDemandKWhDay = scenario.elec_ev || 0;
      if (evDemandKWhDay === 0) return null;

      const operatingDays = 365;
      const annualKWh = evDemandKWhDay * operatingDays;
      const annualMWh = annualKWh / 1000;

      // Station sizing — DCFC (150 kW) + Level 2 (19 kW) mix
      const peakKW = evDemandKWhDay / 12; // assume 12-hr effective peak
      const numDCFC = Math.max(2, Math.ceil(peakKW / 150));
      const numL2 = Math.max(2, Math.ceil((evDemandKWhDay - numDCFC * 150 * 8) / (19 * 12)));

      // CAPEX — NREL DCFC: $100–150K/unit installed; L2: $10–15K/unit
      const capexDCFC = numDCFC * 130000; // charger + power electronics
      const capexL2 = Math.max(0, numL2) * 12000;
      const transformer = 50000 * Math.pow(peakKW / 300, 0.60); // utility interconnection
      const switchgear = 40000;
      const controls = 30000;
      const siteCivil = 80000 + numDCFC * 15000; // pad, conduit, canopy per DCFC
      const equipment = capexDCFC + capexL2 + transformer + switchgear + controls;
      const installation = equipment * 0.18;
      const engineering = equipment * 0.08;
      const permitting = 20000;
      const subtotal = equipment + siteCivil + installation + engineering + permitting;
      const contingency = subtotal * 0.10;
      const totalCapex = subtotal + contingency;

      // Electricity sourcing cost
      const gridKWh = scenario.elec_grid || 0;
      const selfGenKWh = evDemandKWhDay - gridKWh;
      // Grid portion at retail rate; self-generated at marginal cost (~$0.03/kWh variable cost)
      const selfGenCostPerKWh = 0.03;
      const annualElecCost = (gridKWh * operatingDays * econ.electricity_price)
        + (selfGenKWh * operatingDays * selfGenCostPerKWh);
      // Demand charges for grid-connected DCFC stations
      const peakGridKW = gridKWh > 0 ? Math.min(peakKW, gridKWh / 12) : 0;
      const annualDemandCharge = peakGridKW * 15 * 12; // $15/kW/month typical

      const opexMaint = totalCapex * 0.02; // charger maintenance, network fees
      const opexNetworkFees = (numDCFC * 200 + Math.max(0, numL2) * 50) * 12; // $/unit/month
      const opexInsurance = totalCapex * 0.01;
      const totalOpex = annualElecCost + annualDemandCharge + opexMaint + opexNetworkFees + opexInsurance;

      // Revenue — EV charging at retail rate (typically $0.30–0.50/kWh for DCFC)
      const evRetailRate = econ.ev_charge_rate || 0.35; // $/kWh blended
      const revenue = annualKWh * evRetailRate;
      const crf = teaCrf(econ.discount_rate, econ.project_life);
      const lcoe = annualKWh > 0 ? (totalCapex * crf + totalOpex) / (annualKWh / 1000) : 0; // $/MWh

      // Cash flows — ramp utilization
      const cashFlows = [-totalCapex];
      let cum = -totalCapex;
      const cumCF = [-totalCapex];
      for (let yr = 1; yr <= econ.project_life; yr++) {
        const util = yr <= 3 ? 0.40 + 0.60 * (yr - 1) / 3 : 1.0;
        const yrRev = revenue * util;
        const yrOpex = annualElecCost * util + annualDemandCharge + opexMaint + opexNetworkFees + opexInsurance;
        const cf = yrRev - yrOpex;
        cashFlows.push(cf); cum += cf; cumCF.push(cum);
      }

      return {
        system: 'EV Station', capex: totalCapex, netCapex: totalCapex,
        annualOpex: totalOpex, annualRevenue: revenue,
        LCOH: null, LCOE: lcoe,
        NPV: teaNpv(cashFlows, econ.discount_rate), IRR: teaIrr(cashFlows),
        payback: teaSimplePayback(cumCF), cashFlows, cumCashFlows: cumCF,
        opexBreakdown: { fuel: annualElecCost + annualDemandCharge, fixedOM: opexMaint + opexNetworkFees, varOM: 0, water: 0, stackRepl: 0 },
        revenueBreakdown: { electricity: revenue },
      };
    };

    // ============================================================
    // INTEGRATED STATION TEA
    // ============================================================
    const calculateStationTEA = (massBalanceResults, econ) => {
      const trigen = massBalanceResults.trigen || {};
      const smr = massBalanceResults.smr || {};
      const elec = massBalanceResults.elec || {};
      const scenario = massBalanceResults.scenario || {};

      const trigenTEA = calculateTriGenTEA(trigen, econ);
      const smrTEA = calculateSMRTEA(smr, econ);
      const elecTEA = calculateElectrolyzerTEA(elec, econ);
      const solarTEA = calculateSolarTEA(econ);
      const windTEA = calculateWindTEA(econ);
      const bessTEA = calculateBESSTEA(econ);
      const h2StationTEA = calculateH2StationTEA(scenario, econ);
      const gh2DeliveryTEA = calculateGH2DeliveryTEA(scenario, econ);
      const lh2DeliveryTEA = calculateLH2DeliveryTEA(scenario, econ);
      const cngStationTEA = calculateCNGStationTEA(scenario, econ);
      const evStationTEA = calculateEVStationTEA(scenario, econ);

      const systems = [trigenTEA, smrTEA, elecTEA, solarTEA, windTEA, bessTEA, h2StationTEA, gh2DeliveryTEA, lh2DeliveryTEA, cngStationTEA, evStationTEA].filter(Boolean);

      const totalCapex = systems.reduce((s, t) => s + t.capex, 0);
      const totalNetCapex = systems.reduce((s, t) => s + t.netCapex, 0);
      const totalAnnualOpex = systems.reduce((s, t) => s + t.annualOpex, 0);
      const totalAnnualRevenue = systems.reduce((s, t) => s + t.annualRevenue, 0);

      // Merged LCOH from H2-producing systems
      const h2Systems = [trigenTEA, smrTEA, elecTEA].filter(Boolean);
      const weightedLCOH = h2Systems.length > 0
        ? h2Systems.reduce((s, t) => s + (t.LCOH || 0) * (t.annualRevenue || 1), 0) /
          h2Systems.reduce((s, t) => s + (t.annualRevenue || 1), 0)
        : 0;

      // Station-level LCOE from electricity-producing systems
      const elecSystems = [trigenTEA, solarTEA, windTEA].filter(Boolean);
      const weightedLCOE = elecSystems.length > 0
        ? elecSystems.reduce((s, t) => s + (t.LCOE || 0) * (t.annualRevenue || 1), 0) /
          elecSystems.reduce((s, t) => s + (t.annualRevenue || 1), 0)
        : 0;

      // Station-level cash flows
      const maxLen = Math.max(...systems.map(s => s.cashFlows.length));
      const stationCashFlows = [];
      const stationCumCF = [];
      let cum = 0;
      for (let i = 0; i < maxLen; i++) {
        const yrCF = systems.reduce((s, t) => s + (t.cashFlows[i] || 0), 0);
        stationCashFlows.push(yrCF);
        cum += yrCF;
        stationCumCF.push(cum);
      }

      // CAPEX breakdown data
      const capexBreakdown = systems.map(s => ({ name: s.system, value: s.capex }));

      // OPEX breakdown (aggregated)
      const opexCategories = { fuel: 0, fixedOM: 0, varOM: 0, water: 0, stackRepl: 0 };
      systems.forEach(s => {
        if (s.opexBreakdown) {
          Object.keys(opexCategories).forEach(k => { opexCategories[k] += s.opexBreakdown[k] || 0; });
        }
      });

      // Revenue breakdown (aggregated)
      const revCategories = {};
      systems.forEach(s => {
        if (s.revenueBreakdown) {
          Object.keys(s.revenueBreakdown).forEach(k => {
            revCategories[k] = (revCategories[k] || 0) + s.revenueBreakdown[k];
          });
        }
      });

      // Cash flow chart data (year-by-year)
      const cashFlowChartData = [];
      for (let i = 0; i < stationCashFlows.length; i++) {
        cashFlowChartData.push({
          year: i === 0 ? 'Year 0' : `Year ${i}`,
          annualCF: stationCashFlows[i] / 1e6,
          cumulativeCF: stationCumCF[i] / 1e6,
        });
      }

      return {
        systems, trigenTEA, smrTEA, elecTEA, solarTEA, windTEA, bessTEA, h2StationTEA, gh2DeliveryTEA, lh2DeliveryTEA, cngStationTEA, evStationTEA,
        totalCapex, totalNetCapex, totalAnnualOpex, totalAnnualRevenue,
        stationLCOH: weightedLCOH,
        stationLCOE: weightedLCOE,
        stationNPV: teaNpv(stationCashFlows, econ.discount_rate),
        stationIRR: stationCashFlows.length > 1 ? teaIrr(stationCashFlows) : 0,
        stationPayback: teaSimplePayback(stationCumCF),
        capexBreakdown, opexCategories, revCategories,
        cashFlowChartData, stationCashFlows, stationCumCF,
      };
    };

    // ============================================================
    // OPTIMIZER: Sensitivity Analysis
    // ============================================================
    const runSensitivity1D = (massBalanceResults, baseEcon, paramKey, paramLabel, numPoints = 20) => {
      const baseVal = baseEcon[paramKey];
      const minVal = baseVal * 0.5;
      const maxVal = baseVal * 2.0;
      const step = (maxVal - minVal) / (numPoints - 1);
      const points = [];
      let breakevenVal = null;
      let prevNPV = null;

      for (let i = 0; i < numPoints; i++) {
        const val = minVal + i * step;
        const testEcon = { ...baseEcon, [paramKey]: val };
        const tea = calculateStationTEA(massBalanceResults, testEcon);
        const pt = { value: val, NPV: tea.stationNPV / 1e6, LCOH: tea.stationLCOH, IRR: tea.stationIRR * 100 };
        points.push(pt);
        if (prevNPV !== null && prevNPV * pt.NPV < 0) {
          // linear interpolation for breakeven
          const prevVal = minVal + (i - 1) * step;
          breakevenVal = prevVal + (val - prevVal) * (-prevNPV / (pt.NPV - prevNPV));
        }
        prevNPV = pt.NPV;
      }
      return { paramKey, paramLabel, baseVal, points, breakevenVal };
    };

    const runSensitivity2D = (massBalanceResults, baseEcon, xKey, yKey, gridSize = 10) => {
      const xBase = baseEcon[xKey];
      const yBase = baseEcon[yKey];
      const xVals = Array.from({ length: gridSize }, (_, i) => xBase * (0.5 + i * 1.5 / (gridSize - 1)));
      const yVals = Array.from({ length: gridSize }, (_, i) => yBase * (0.5 + i * 1.5 / (gridSize - 1)));
      const grid = [];
      for (let yi = 0; yi < gridSize; yi++) {
        const row = [];
        for (let xi = 0; xi < gridSize; xi++) {
          const testEcon = { ...baseEcon, [xKey]: xVals[xi], [yKey]: yVals[yi] };
          const tea = calculateStationTEA(massBalanceResults, testEcon);
          row.push({ NPV: tea.stationNPV / 1e6, IRR: tea.stationIRR * 100, LCOH: tea.stationLCOH });
        }
        grid.push(row);
      }
      return { xVals, yVals, grid };
    };

    const runScenarioRanking = (baseInputs, baseEcon) => {
      const scenarios = [
        { name: 'TriGen Only', overrides: { smr_H2_tpd: 0, electrolyzer_H2_tpd: 0, lh2_tpd: 0, gh2_trailer_kg_day: 0 } },
        { name: 'Electrolyzer Only', overrides: { trigen_NG_scf_h: 0, smr_H2_tpd: 0, electrolyzer_H2_tpd: 1.0, lh2_tpd: 0, gh2_trailer_kg_day: 0 } },
        { name: 'SMR Only', overrides: { trigen_NG_scf_h: 0, smr_H2_tpd: 1.0, electrolyzer_H2_tpd: 0, lh2_tpd: 0, gh2_trailer_kg_day: 0 } },
        { name: 'GH2 Delivery Only', overrides: { trigen_NG_scf_h: 0, smr_H2_tpd: 0, electrolyzer_H2_tpd: 0, lh2_tpd: 0, gh2_trailer_kg_day: 1000 } },
        { name: 'LH2 Delivery Only', overrides: { trigen_NG_scf_h: 0, smr_H2_tpd: 0, electrolyzer_H2_tpd: 0, lh2_tpd: 1.0, gh2_trailer_kg_day: 0 } },
        { name: 'TriGen + SMR', overrides: { smr_H2_tpd: 0.5, electrolyzer_H2_tpd: 0, lh2_tpd: 0, gh2_trailer_kg_day: 0 } },
        { name: 'TriGen + Electrolyzer', overrides: { smr_H2_tpd: 0, electrolyzer_H2_tpd: 0.5, lh2_tpd: 0, gh2_trailer_kg_day: 0 } },
        { name: 'TriGen + GH2', overrides: { smr_H2_tpd: 0, electrolyzer_H2_tpd: 0, lh2_tpd: 0, gh2_trailer_kg_day: 500 } },
        { name: 'TriGen + LH2', overrides: { smr_H2_tpd: 0, electrolyzer_H2_tpd: 0, lh2_tpd: 0.5, gh2_trailer_kg_day: 0 } },
        { name: 'All Sources', overrides: { smr_H2_tpd: 0.2, electrolyzer_H2_tpd: 0.2, lh2_tpd: 0.2, gh2_trailer_kg_day: 200 } },
      ];

      return scenarios.map(sc => {
        const testInputs = { ...baseInputs, ...sc.overrides };
        const massResults = runScenario(testInputs);
        const trigen = calculateTriGen(testInputs.trigen_NG_scf_h);
        const smr = calculateSMR(testInputs.smr_H2_tpd);
        const elec = calculateElectrolyzer(testInputs.electrolyzer_H2_tpd);
        const tea = calculateStationTEA({ trigen, smr, elec, scenario: massResults }, baseEcon);

        let status = 'UNVIABLE';
        const irr = tea.stationIRR * 100;
        const pb = tea.stationPayback;
        const lcoh = tea.stationLCOH;
        const npv = tea.stationNPV;
        if (irr >= 8 && pb <= 10 && lcoh <= 10 && npv > 0) status = 'OPTIMAL';
        else if (irr >= 5 && pb <= 12 && npv > 0) status = 'VIABLE';
        else if (npv > 0) status = 'MARGINAL';

        return {
          name: sc.name,
          capex: tea.totalCapex / 1e6,
          lcoh,
          npv: npv / 1e6,
          irr,
          payback: pb,
          status,
        };
      });
    };

    // ============================================================
    // NEWS IMPACT ANALYZER - Config Generators
    // ============================================================

    // H2 source definitions: each maps to physical input keys
    const H2_SOURCES = [
      { id: 'trigen',  label: 'TriGen',        inputKey: 'trigen_NG_scf_h', unit: 'scf_h', baseFullDemand: 10700 },

      { id: 'trigen',     label: 'TriGen' },

    const generateH2Configs = (h2DemandKgDay) => {
      const configs = [];
      const ratios = [1.0]; // singles
      const mixRatios = [0.30, 0.50, 0.70];

      // Build input set for a given source mix
      const buildInputs = (sources) => {
        // Start with all zeros
        const inp = { trigen_NG_scf_h: 0, smr_H2_tpd: 0, electrolyzer_H2_tpd: 0, lh2_tpd: 0, gh2_trailer_kg_day: 0 };
        sources.forEach(({ src, frac }) => {
          inp[src.inputKey] = src.baseFullDemand * frac;
        });
        return inp;
      };

      // Singles
      H2_SOURCES.forEach(src => {
        configs.push({
          name: src.label + ' Only',
          category: 'single',
          inputs: buildInputs([{ src, frac: 1.0 }]),
        });
      });

      // Pairs at 3 ratios
      for (let i = 0; i < H2_SOURCES.length; i++) {
        for (let j = i + 1; j < H2_SOURCES.length; j++) {
          const a = H2_SOURCES[i], b = H2_SOURCES[j];
          mixRatios.forEach(r => {
            const nameA = Math.round(r * 100);
            const nameB = Math.round((1 - r) * 100);
            configs.push({
              name: a.label + ' ' + nameA + ' / ' + b.label + ' ' + nameB,
              category: 'mix',
              inputs: buildInputs([{ src: a, frac: r }, { src: b, frac: 1 - r }]),
            });
          });
        }
      }

      return configs;
    };

    const generateEVConfigs = (evDemandKWh, baseInputs, baseEcon) => {
      const configs = [];
      const mixRatios = [0.30, 0.50, 0.70];

      // Each EV source: how to model its economics
      // We compute annual cost to supply the kWh fraction
      const computeEVSourceCost = (sourceId, fractionKWh, econ) => {
        const annualKWh = fractionKWh * 365;
        switch (sourceId) {
          case 'trigen': {
            // TriGen: NG fuel cost for electricity at ~50% eff
            const kWhPerScf = 1037 / 3412 * 0.50;
            const scfNeeded = fractionKWh / kWhPerScf;
            const costPerDay = scfNeeded * econ.ng_price / 1000; // ng_price is $/MMBtu, ~1000 scf/MMBtu
            return { annualCost: costPerDay * 365, capex: fractionKWh / 24 * 5000, label: 'TriGen' }; // $5000/kW
          }
          case 'fc_batt': {
            // Fuel cell: H2 -> electricity at 50% eff, 33.33 kWh/kg LHV
            const h2KgDay = fractionKWh / (33.33 * 0.50);
            const annualH2 = h2KgDay * 365;
            const h2Cost = annualH2 * (econ.h2_station_feedstock_cost || 5.0);
            const fcCapex = fractionKWh / 24 * 3000; // ~$3000/kW
            const battCapex = fractionKWh / 24 * 4 * 200; // 4hr battery @ $200/kWh
            return { annualCost: h2Cost + (fcCapex + battCapex) * 0.05, capex: fcCapex + battCapex, label: 'FC+Battery' };
          }
          case 'grid': {
            return { annualCost: fractionKWh * 365 * econ.electricity_price, capex: 50000, label: 'Grid' }; // minimal interconnect
          }
          case 'renewables': {
            // Solar + wind mix, capacity factor ~0.28
            const peakKW = fractionKWh / 24 / 0.28;
            const capex = peakKW * 1000 * (econ.solar_capex_per_wdc || 0.60); // $/W
            const annualOM = capex * 0.015;
            return { annualCost: annualOM, capex, label: 'Renewables' };
          }
          default:
            return { annualCost: 0, capex: 0, label: '' };
        }
      };

      // Evaluate an EV config: returns economics metrics
      const evalEVConfig = (sources, econ) => {
        let totalAnnualCost = 0, totalCapex = 0;
        sources.forEach(({ id, frac }) => {
          const res = computeEVSourceCost(id, evDemandKWh * frac, econ);
          totalAnnualCost += res.annualCost;
          totalCapex += res.capex;
        });
        const annualKWh = evDemandKWh * 365;
        const lcoe = annualKWh > 0 ? (totalAnnualCost + totalCapex * teaCrf(econ.discount_rate, econ.project_life)) / annualKWh : 0;
        const annualRevenue = annualKWh * econ.electricity_price; // selling at grid price
        const annualProfit = annualRevenue - totalAnnualCost;
        const crf = teaCrf(econ.discount_rate, econ.project_life);
        const npv = -totalCapex + annualProfit / crf; // simplified NPV
        return { totalCapex, totalAnnualCost, lcoe, npv, annualRevenue };
      };

      // Singles
      EV_SOURCES.forEach(src => {
        configs.push({
          name: src.label + ' Only',
          category: 'single',
          sources: [{ id: src.id, frac: 1.0 }],
          evalFn: evalEVConfig,
        });
      });

      // Pairs at 3 ratios
      for (let i = 0; i < EV_SOURCES.length; i++) {
        for (let j = i + 1; j < EV_SOURCES.length; j++) {
          const a = EV_SOURCES[i], b = EV_SOURCES[j];
          mixRatios.forEach(r => {
            const nameA = Math.round(r * 100);
            const nameB = Math.round((1 - r) * 100);
            configs.push({
              name: a.label + ' ' + nameA + ' / ' + b.label + ' ' + nameB,
              category: 'mix',
              sources: [{ id: a.id, frac: r }, { id: b.id, frac: 1 - r }],
              evalFn: evalEVConfig,
            });
          });
        }
      }

      return configs;
    };

    // ============================================================
    // NEWS IMPACT ANALYSIS ENGINE
    // ============================================================
    const runNewsImpactAnalysis = (baseInputs, baseEcon, signal) => {
      const h2Configs = generateH2Configs(baseInputs.H2_demand || 1000);
      const evConfigs = generateEVConfigs(baseInputs.ev_demand_kWh || 20000, baseInputs, baseEcon);

      const classify = (tea) => {
        const irr = tea.stationIRR * 100;
        const pb = tea.stationPayback;
        const lcoh = tea.stationLCOH;
        const npv = tea.stationNPV;
        if (irr >= 8 && pb <= 10 && lcoh <= 10 && npv > 0) return 'OPTIMAL';
        if (irr >= 5 && pb <= 12 && npv > 0) return 'VIABLE';
        if (npv > 0) return 'MARGINAL';
        return 'UNVIABLE';
      };

      // Sorting is done at render time via h2SortKey/evSortKey state

      // Evaluate all H2 configs with given economics
      const evaluateH2 = (econ) => {
        return h2Configs.map(cfg => {
          const testInputs = { ...baseInputs, ...cfg.inputs };
          const massResults = runScenario(testInputs);
          const trigen = calculateTriGen(testInputs.trigen_NG_scf_h);
          const smr = calculateSMR(testInputs.smr_H2_tpd);
          const elec = calculateElectrolyzer(testInputs.electrolyzer_H2_tpd);
          const tea = calculateStationTEA({ trigen, smr, elec, scenario: massResults }, econ);
          return {
            name: cfg.name,
            category: cfg.category,
            capex: tea.totalCapex / 1e6,
            lcoh: tea.stationLCOH,
            npv: tea.stationNPV / 1e6,
            irr: tea.stationIRR * 100,
            payback: tea.stationPayback,
            status: classify(tea),
          };
        });
      };

      // Evaluate all EV configs with given economics
      const evaluateEV = (econ) => {
        return evConfigs.map(cfg => {
          const res = cfg.evalFn(cfg.sources, econ);
          return {
            name: cfg.name,
            category: cfg.category,
            capex: res.totalCapex / 1e6,
            lcoe: res.lcoe * 1000, // $/kWh -> $/MWh
            npv: res.npv / 1e6,
            annualCost: res.totalAnnualCost / 1e6,
            irr: 0,
            lcoh: 0,
          };
        });
      };

      // Apply signal at a given level
      const applySignal = (level) => {
        const mod = { ...baseEcon };
        signal.affects.forEach(aff => {
          const adj = 1 + (level.multiplier - 1) * aff.scale;
          mod[aff.param] = baseEcon[aff.param] * adj;
        });
        return mod;
      };

      // Baseline (unsorted — sorting applied at render time)
      const baseH2 = evaluateH2(baseEcon);
      const baseEV = evaluateEV(baseEcon);
      // Build lookup maps for delta computation
      const baseH2Map = {};
      baseH2.forEach(sc => { baseH2Map[sc.name] = sc; });
      const baseEVMap = {};
      baseEV.forEach(sc => { baseEVMap[sc.name] = sc; });

      // Impact levels
      const impactLevels = signal.levels.map(level => {
        const modEcon = applySignal(level);

        // H2
        const h2Scenarios = evaluateH2(modEcon);
        h2Scenarios.forEach(sc => {
          const base = baseH2Map[sc.name];
          if (base) {
            sc.npvDelta = sc.npv - base.npv;
            sc.lcohDelta = sc.lcoh - base.lcoh;
            sc.baseNpv = base.npv;
            sc.baseLcoh = base.lcoh;
            sc.baseStatus = base.status;
          }
        });

        // EV
        const evScenarios = evaluateEV(modEcon);
        evScenarios.forEach(sc => {
          const base = baseEVMap[sc.name];
          if (base) {
            sc.npvDelta = sc.npv - base.npv;
            sc.lcoeDelta = sc.lcoe - base.lcoe;
            sc.baseNpv = base.npv;
            sc.baseLcoe = base.lcoe;
          }
        });

        const paramChanges = signal.affects.map(aff => ({
          param: aff.param,
          baseVal: baseEcon[aff.param],
          newVal: modEcon[aff.param],
        }));

        return {
          tag: level.tag,
          severity: level.severity,
          paramChanges,
          h2Scenarios,
          evScenarios,
        };
      });

      // Chart data: top 5 H2 configs by NPV across levels
      const top5H2Names = [...baseH2].sort((a, b) => b.npv - a.npv).slice(0, 5).map(s => s.name);
      const h2ChartData = top5H2Names.map(name => {
        const base = baseH2.find(s => s.name === name);
        const row = { name, baseline: base.npv };
        impactLevels.forEach(lv => {
          const imp = lv.h2Scenarios.find(s => s.name === name);
          row[lv.severity] = imp ? imp.npv : 0;
        });
        return row;
      });

      const top5EVNames = [...baseEV].sort((a, b) => a.lcoe - b.lcoe).slice(0, 5).map(s => s.name);
      const evChartData = top5EVNames.map(name => {
        const base = baseEV.find(s => s.name === name);
        const row = { name, baseline: base.lcoe };
        impactLevels.forEach(lv => {
          const imp = lv.evScenarios.find(s => s.name === name);
          row[lv.severity] = imp ? imp.lcoe : 0;
        });
        return row;
      });

      return {
        signal,
        baselineH2: baseH2,
        baselineEV: baseEV,
        impactLevels,
        h2ChartData,
        evChartData,
      };
