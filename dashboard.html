                                    <th className="text-right py-1">&Delta;NPV</th>
                                    {h2Hdr('LCOH', 'lcoh')}
                                    <th className="text-right py-1">&Delta;LCOH</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {sortedLvH2.slice(0, showAllH2 ? 999 : 10).map((sc, idx) => (
                                    <tr key={sc.name} className="border-b border-gray-700/50">
                                      <td className="py-1 text-gray-500">{idx + 1}</td>
                                      <td className="py-1">{sc.name}</td>
                                      <td className={"text-right " + (sc.npv > 0 ? 'text-green-400' : 'text-red-400')}>{sc.npv.toFixed(1)}</td>
                                      <td className={"text-right " + ((sc.npvDelta || 0) >= 0 ? 'text-green-400' : 'text-red-400')}>
                                        {(sc.npvDelta || 0) >= 0 ? '+' : ''}{(sc.npvDelta || 0).toFixed(1)}
                                      </td>
                                      <td className="text-right">${sc.lcoh.toFixed(2)}</td>
                                      <td className={"text-right " + ((sc.lcohDelta || 0) <= 0 ? 'text-green-400' : 'text-red-400')}>
                                        {(sc.lcohDelta || 0) >= 0 ? '+' : ''}{(sc.lcohDelta || 0).toFixed(2)}
                                      </td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>

                            <div>
                              <h4 className="text-sm text-gray-400 mb-2">EV Configs</h4>
                              <table className="w-full text-xs">
                                <thead>
                                  <tr className="text-gray-400 border-b border-gray-700">
                                    <th className="text-left py-1 w-6">#</th>
                                    <th className="text-left py-1">Config</th>
                                    {evHdr('LCOE', 'lcoe')}
                                    <th className="text-right py-1">&Delta;LCOE</th>
                                    {evHdr('NPV', 'npv')}
                                    <th className="text-right py-1">&Delta;NPV</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {sortedLvEV.slice(0, showAllEV ? 999 : 10).map((sc, idx) => (
                                    <tr key={sc.name} className="border-b border-gray-700/50">
                                      <td className="py-1 text-gray-500">{idx + 1}</td>
                                      <td className="py-1">{sc.name}</td>
                                      <td className="text-right">${sc.lcoe.toFixed(1)}</td>
                                      <td className={"text-right " + ((sc.lcoeDelta || 0) <= 0 ? 'text-green-400' : 'text-red-400')}>
                                        {(sc.lcoeDelta || 0) >= 0 ? '+' : ''}{(sc.lcoeDelta || 0).toFixed(1)}
                                      </td>
                                      <td className={"text-right " + (sc.npv > 0 ? 'text-green-400' : 'text-red-400')}>{sc.npv.toFixed(1)}</td>
                                      <td className={"text-right " + ((sc.npvDelta || 0) >= 0 ? 'text-green-400' : 'text-red-400')}>
                                        {(sc.npvDelta || 0) >= 0 ? '+' : ''}{(sc.npvDelta || 0).toFixed(1)}
                                      </td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        </div>
                      );
                    })}

                    {/* Charts: NPV comparison (H2) and LCOE comparison (EV) */}
                    <div className="grid grid-cols-2 gap-4">
                      <div className="bg-gray-800 rounded-xl p-4">
                        <h3 className="text-lg font-semibold mb-3">H2 NPV Across Impact Levels (Top 5)</h3>
                        <ResponsiveContainer width="100%" height={300}>
                          <BarChart data={newsImpactResults.h2ChartData}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                            <XAxis dataKey="name" tick={{ fontSize: 9 }} angle={-20} textAnchor="end" height={60} />
                            <YAxis tickFormatter={(v) => '$' + v.toFixed(0) + 'M'} />
                            <Tooltip formatter={(v) => '$' + v.toFixed(2) + 'M'} />
                            <Legend />
                            <Bar dataKey="baseline" fill="#3b82f6" name="Baseline" radius={[3,3,0,0]} />
                            <Bar dataKey="mild" fill="#eab308" name="Mild" radius={[3,3,0,0]} />
                            <Bar dataKey="moderate" fill="#f97316" name="Moderate" radius={[3,3,0,0]} />
                            <Bar dataKey="severe" fill="#ef4444" name="Severe" radius={[3,3,0,0]} />
                          </BarChart>
                        </ResponsiveContainer>
                      </div>

                      <div className="bg-gray-800 rounded-xl p-4">
                        <h3 className="text-lg font-semibold mb-3">EV LCOE Across Impact Levels (Top 5)</h3>
                        <ResponsiveContainer width="100%" height={300}>
                          <BarChart data={newsImpactResults.evChartData}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                            <XAxis dataKey="name" tick={{ fontSize: 9 }} angle={-20} textAnchor="end" height={60} />
                            <YAxis tickFormatter={(v) => '$' + v.toFixed(0)} />
                            <Tooltip formatter={(v) => '$' + v.toFixed(1) + '/MWh'} />
                            <Legend />
                            <Bar dataKey="baseline" fill="#3b82f6" name="Baseline" radius={[3,3,0,0]} />
                            <Bar dataKey="mild" fill="#eab308" name="Mild" radius={[3,3,0,0]} />
                            <Bar dataKey="moderate" fill="#f97316" name="Moderate" radius={[3,3,0,0]} />
                            <Bar dataKey="severe" fill="#ef4444" name="Severe" radius={[3,3,0,0]} />
                          </BarChart>
                        </ResponsiveContainer>
                      </div>
                    </div>

                    {/* Quick Insight */}
                    <div className="bg-gray-800 rounded-xl p-4 border border-gray-700">
                      <h3 className="text-sm font-semibold text-gray-400 mb-2">Quick Insight</h3>
                      <p className="text-sm text-gray-300">
                        {(() => {
                          const severe = newsImpactResults.impactLevels[2];
                          const sevH2byNPV = [...severe.h2Scenarios].sort((a, b) => b.npv - a.npv);
                          const baseH2byNPV = [...newsImpactResults.baselineH2].sort((a, b) => b.npv - a.npv);
                          const sevEVbyLCOE = [...severe.evScenarios].sort((a, b) => a.lcoe - b.lcoe);
                          const baseEVbyLCOE = [...newsImpactResults.baselineEV].sort((a, b) => a.lcoe - b.lcoe);
                          const recH2 = sevH2byNPV[0];
                          const baseRecH2 = baseH2byNPV[0];
                          const recEV = sevEVbyLCOE[0];
                          const baseRecEV = baseEVbyLCOE[0];
                          const parts = [];
                          if (recH2.name === baseRecH2.name) {
                            parts.push(recH2.name + ' remains the top H2 config even under ' + severe.tag + ' (NPV $' + baseRecH2.npv.toFixed(1) + 'M \u2192 $' + recH2.npv.toFixed(1) + 'M).');
                          } else {
                            const oldSevere = severe.h2Scenarios.find(s => s.name === baseRecH2.name);
                            parts.push('H2 recommendation shifts from ' + baseRecH2.name + ' to ' + recH2.name + ' under ' + severe.tag + ' (NPV $' + recH2.npv.toFixed(1) + 'M vs $' + (oldSevere ? oldSevere.npv.toFixed(1) : '?') + 'M).');
                          }
                          if (recEV.name === baseRecEV.name) {
                            parts.push(recEV.name + ' stays the best EV config (LCOE $' + recEV.lcoe.toFixed(0) + '/MWh).');
                          } else {
                            parts.push('EV recommendation shifts from ' + baseRecEV.name + ' to ' + recEV.name + ' (LCOE $' + recEV.lcoe.toFixed(0) + '/MWh).');
                          }
                          return parts.join(' ');
                        })()}
                      </p>
                      <p className="text-xs text-gray-500 mt-2">
                        CNG station operates as standalone. {newsImpactResults.baselineH2.length} H2 configs and {newsImpactResults.baselineEV.length} EV configs evaluated at each level.
                        Click any column header to sort. Currently sorting H2 by {h2SortKey.toUpperCase()} ({h2SortAsc ? 'asc' : 'desc'}), EV by {evSortKey.toUpperCase()} ({evSortAsc ? 'asc' : 'desc'}).
                      </p>
                    </div>
                    </React.Fragment>);
                    })()}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StationDashboard />);
  </script>
</body>
</html>
