# ---- Capacity Conversion Factors --------------------------------------------
capacity_conversions:
  TPD_H2_to_MTPA: 0.000365       # 1 TPD H2 = 0.000365 MTPA H2
  MTPA_NH3_to_MTPA_H2: 0.178     # 1 MTPA NH3 = 0.178 MTPA H2 equivalent
  GW_electrolyzer_to_MTPA_H2: 0.16  # 1 GW electrolyzer = 0.16 MTPA H2 (50% CF)
  MW_electrolyzer_to_MTPA_H2: 0.00016  # 1 MW = 0.00016 MTPA H2

