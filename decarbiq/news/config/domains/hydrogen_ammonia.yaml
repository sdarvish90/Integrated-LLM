# ---- Priority Score Calculation ---------------------------------------------
priority_scoring:
  base_multiplier: 50         # relevance_score * 50 = 0-50 base
  developer_bonus: 10         # Known developer detected
  fid_epc_bonus: 15           # FID or EPC Award status
  feed_prefeed_bonus: 10      # FEED or Pre-FEED status
  capacity_bonus: 10          # Capacity value detected
  high_deal_bonus: 10         # deal_value > $100M

# ---- Market Impact Classification -------------------------------------------
market_impact:
  HIGH:
    triggers_llm: true
    conditions:
      - "status in ['FID', 'EPC Award']"
      - "deal_value_usd > 500000000"
  MEDIUM:
    triggers_llm: false
    conditions:
      - "status in ['Construction', 'FEED']"
      - "capacity_mtpa_h2 is not None"
  LOW:
    triggers_llm: false
    conditions:
      - "everything else"
