# ---- Relevance Threshold ---------------------------------------------------
relevance_threshold: 0.55
borderline_low: 0.45
borderline_high: 0.65

# ---- Entity Types (GLiNER Layer 2) -----------------------------------------
entity_types:
  - company
  - project_name
  - capacity
  - technology
  - product
  - location
  - status
  - epc_contractor
  - date
  - money

# ---- Relation Types (GLiREL Layer 3) ---------------------------------------
relation_types:
  - develops
  - located_in
  - capacity_of
  - uses_technology
  - contracted_by
  - produces
  - invested_in

# ---- Technology Normalization -----------------------------------------------
technology_patterns:
  SMR:
    - "steam methane reform"
    - "SMR"
    - "steam reform"
  ATR:
    - "autothermal reform"
    - "ATR"
    - "auto-thermal"
  Electrolysis:
    - "electrolyz"
    - "electrolyser"
    - "PEM"
    - "alkaline electrolysis"
    - "SOEC"
  CCUS:
    - "carbon capture"
    - "CCS"
    - "CCUS"
    - "CO2 capture"
    - "carbon sequestration"

